<body><header><h1>WARMA · viewport real</h1><div role="group" aria-label="Ancho del viewport"><button data-width="320" aria-pressed="false">320 px</button><button data-width="360" aria-pressed="false">360 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430" aria-pressed="false">430 px</button></div></header><main><iframe id="viewport" name="warma-viewport" src="/" width="390" height="844" title="WARMA en viewport móvil"></iframe></main><nav aria-label="Acceso directo al candidato"><a href="/#world" target="warma-viewport">Inicio</a><a href="/#path" target="warma-viewport">Camino</a><a href="/#journal" target="warma-viewport">Bitácora</a><a href="/#focus" target="warma-viewport">Concentración</a><a href="/#garden" target="warma-viewport">Mi jardín</a><a href="/#settings" target="warma-viewport">Preferencias</a></nav><p>Revisión de composición en Chrome. No sustituye pruebas en un teléfono físico. Usa sólo datos de prueba.</p><script>const frame=document.getElementById('viewport');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.width=button.dataset.width;document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></body></html>
